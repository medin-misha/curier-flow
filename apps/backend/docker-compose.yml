# Полный стек: инфраструктура (PostgreSQL, RabbitMQ, Redis, MinIO) плюс сами
# процессы приложения — api и worker.
#
# Значения берутся из .env (см. .env.example); дефолты продублированы здесь,
# чтобы `docker compose up -d` работал и без .env.
name: backend-template

# Общая часть процессов приложения. Файл .env рассчитан на запуск с хоста и
# содержит адреса вида localhost; внутри compose те же сервисы зовутся по
# именам. Блок environment перекрывает env_file, поэтому один и тот же .env
# обслуживает оба способа запуска: локальный uvicorn берёт localhost, контейнер
# получает имена сервисов. Сам .env необязателен — без него работают дефолты.
x-app: &app
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_DSN: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    RABBITMQ_DSN: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    REDIS_DSN: redis://redis:6379/0
    # Внутренний адрес хранилища: по нему в MinIO ходит само приложение.
    S3_ENDPOINT_URL: http://minio:9000
    # Адрес, по которому в MinIO приходит браузер. Подпись SigV4 накрывает
    # Host, поэтому ссылка, подписанная на http://minio:9000, снаружи отдала бы
    # SignatureDoesNotMatch: presigned-ссылки подписываются по этому адресу.
    S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}

services:
  api:
    <<: *app
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Бакет обязан существовать до старта: /health/ready проверяет именно его.
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Строго /health/live: readiness падает вместе с любой зависимостью, и
      # healthcheck на нём перезапускал бы исправный контейнер из-за чужой
      # аварии. Liveness отвечает, пока жив процесс, — это и есть повод
      # перезапускать. В образе python:3.12-slim нет ни curl, ни wget, поэтому
      # проверка делается интерпретатором: urlopen кидает на любом не-2xx.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    <<: *app
    build:
      context: .
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Healthcheck не задан намеренно: честной проверки у воркера нет. Порта он
    # не слушает, а «процесс не умер» docker знает и без нас — такая проверка
    # создавала бы только видимость контроля.
    #
    # После SIGTERM воркер дожидается начатой работы WORKER_SHUTDOWN_TIMEOUT
    # секунд (по умолчанию 30). Дефолтные 10 секунд docker добили бы его
    # SIGKILL посреди обработки сообщения, поэтому запас задан явно.
    stop_grace_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # initdb-аргументы: без них локаль контейнера влияет на порядок сортировки
      # и индексы расходятся с продовыми.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # check_running говорит, что поднялась нода; check_local_alarms ловит
      # исчерпание диска и памяти, при котором брокер молча перестаёт принимать
      # публикации.
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Result backend TaskIQ: результаты задач переживают перезапуск контейнера,
    # но не являются источником истины, поэтому хватает RDB без AOF.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Одноразовое создание бакета: /health/ready делает HEAD по бакету сервиса,
  # а не листинг всех бакетов (в проде у сервиса ключи только на свой бакет),
  # и на пустом MinIO проверка иначе была бы красной с первого запуска.
  # Тот же образ, что и у minio: `mc` лежит в нём, отдельный тянуть незачем.
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-app-files}
    # $$ экранирует подстановку compose: переменные раскрывает шелл внутри
    # контейнера, иначе пароль попал бы в текст команды и в `docker inspect`.
    entrypoint:
      [
        "sh",
        "-c",
        'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"',
      ]

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:
