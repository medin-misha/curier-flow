# Метрики, логи и визуализация. Проект запускается после инфраструктуры, которая
# создаёт внешнюю сеть curier-flow.
name: curier-flow-logging

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # /data хранит локальный CA и ACME-сертификаты с ключами для продления.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - public
      - curier-flow
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_METRICS_ENABLED: "true"
      GF_SERVER_DOMAIN: grafana.${PUBLIC_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: https://grafana.${PUBLIC_DOMAIN:-localhost}/
      # Production image фиксирован по версии; фоновые загрузки bundled-плагинов
      # не должны менять его содержимое или создавать лишние error-записи.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    networks:
      - observability
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    logging: *default-logging
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-720h}
    volumes:
      - loki-data:/loki
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
    networks:
      - observability
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - alloy-data:/var/lib/alloy/data
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      docker-socket-proxy:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - observability
      - docker-api

  # Прямой socket в контейнер сборщика не передаётся, а proxy доступен только
  # Alloy: read-only Docker API всё равно раскрывает metadata и env контейнеров.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
    volumes:
      - prometheus-data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
    networks:
      - observability
      - curier-flow
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    logging: *default-logging
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - observability

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/blackbox/config.yml
    volumes:
      - ./observability/blackbox/config.yml:/etc/blackbox/config.yml:ro
    networks:
      - observability
      - curier-flow

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-app}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-app}
    networks:
      - observability
      - curier-flow

  redis-exporter:
    image: oliver006/redis_exporter:v1.90.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - observability
      - curier-flow

volumes:
  alloy-data:
  caddy-config:
  caddy-data:
  grafana-data:
  loki-data:
  prometheus-data:

networks:
  # Внутренняя сеть не даёт observability-сервисам лишний выход наружу.
  observability:
    name: curier-flow-observability
    internal: true
  # Через эту bridge-сеть Caddy проксирует Grafana; хранилища и collectors
  # остаются изолированы в observability.
  public:
    name: curier-flow-observability-public
  # Docker API изолирован даже от Grafana и остальных collectors.
  docker-api:
    internal: true
  curier-flow:
    name: curier-flow
    external: true

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
