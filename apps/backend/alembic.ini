# Конфигурация Alembic.
#
# Строки подключения здесь нет намеренно: DSN приходит из app.kernel.config,
# то есть из окружения. Продублированный в .ini пароль неизбежно разъезжается
# с настройками приложения и попадает в репозиторий.
#
# Секций логирования тоже нет: env.py настраивает логи через app.kernel.logging,
# чтобы вывод миграций совпадал по формату с логами сервиса.

[alembic]
script_location = alembic
# Проект живёт в src-layout; путь нужен на случай запуска alembic вне
# установленного окружения (в CI и в контейнере пакет уже установлен).
prepend_sys_path = src
# Разделитель путей в prepend_sys_path. Задан явно: без него Alembic 1.19
# разбирает список по историческому набору разделителей и предупреждает об
# устаревании, а предупреждения в прогоне тестов настроены как ошибки.
path_separator = os
# Дата в начале имени: содержимое versions/ сортируется по времени создания,
# а не по случайному хешу ревизии.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
