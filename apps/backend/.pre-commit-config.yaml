# Установка хуков: make install (или uv run pre-commit install).
#
# ruff, mypy и lint-imports вызываются локально через uv, а не через
# pre-commit-репозитории с отдельным пином версии: иначе версия линтера в хуке
# и версия в uv.lock расходятся, и `make check` с `git commit` начинают
# расходиться в вердиктах.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: lint-imports
        name: lint-imports
        entry: uv run lint-imports
        language: system
        types_or: [python, pyi]
        pass_filenames: false
