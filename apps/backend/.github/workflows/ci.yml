name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Локальный кеш uv внутри workspace, чтобы actions/cache его подхватил.
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Версия интерпретатора берётся из .python-version, не из окружения ранера.
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Lint, types, import contracts
        run: make check

  test:
    name: test
    runs-on: ubuntu-latest
    # Инфраструктура не поднимается через `services`: интеграционные тесты
    # используют testcontainers, а он сам запускает контейнеры через docker-сокет
    # ранера. Дублирующие сервисы только заняли бы порты.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Run tests
        run: make test

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    # Здесь, в отличие от job test, база нужна одна и заранее: миграции
    # накатываются на неё командой, а не тестом, и testcontainers не при чём.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_DSN: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Apply migrations
        run: uv run alembic upgrade head

      # Расхождение моделей и миграций ловится здесь, а не на выкатке:
      # check падает, если autogenerate нашёл бы что генерировать.
      - name: Check models match migrations
        run: uv run alembic check

      # Полный цикл: откат обязан доводить базу до пустой. Миграция без
      # рабочего downgrade обнаруживается здесь, а не в ночь инцидента, когда
      # выкатку понадобится откатить.
      - name: Roll every migration back
        run: uv run alembic downgrade base

      # Без этой проверки пустой downgrade() прошёл бы молча: команда не
      # обязана ничего удалять, чтобы завершиться успешно. Таблица
      # alembic_version остаётся всегда — это журнал самого Alembic.
      - name: Verify nothing is left behind
        run: |
          left=$(psql "postgresql://app:app@localhost:5432/app" -tAc \
            "SELECT count(*) FROM information_schema.tables
              WHERE table_schema = 'public' AND table_name <> 'alembic_version'")
          test "$left" -eq 0 || { echo "tables left after downgrade: $left"; exit 1; }
